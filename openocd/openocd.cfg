# OpenOCD Flash Write Configuration for ML63Q2537 with 48MHz Clock
# Sets system clock to 48MHz PLL before flash programming

# Interface
adapter driver jlink
transport select swd
adapter speed 5000000

# Create DAP
swd newdap ml63 cpu -expected-id 0x0bc11477
dap create ml63.dap -chain-position ml63.cpu

# Server ports
gdb_port 3333
telnet_port 4444
tcl_port 6666

init

# Register Base Addresses
set LSICNT_BASE     0x40000000
set CLKCNT_BASE     0x40000300
set FLASHCNT_BASE   0x40000400
set UARTF0          0x41001800
set NINT            0x40000100
set PORT3           0x40010060
set WDT_BASE        0x40003000

set CLKCON         [expr {$LSICNT_BASE + 0x4C}] ;
set RSTCON         [expr {$LSICNT_BASE + 0x50}] ;

# Clock Control Registers (CLKCNT)
set FCON01         [expr {$CLKCNT_BASE + 0x00}]  ;# Frequency control register 01
set FCON23         [expr {$CLKCNT_BASE + 0x04}]  ;# Frequency control register 23
set FSTAT          [expr {$CLKCNT_BASE + 0x08}]  ;# Frequency status register
set FCON67         [expr {$CLKCNT_BASE + 0x14}]  ;# Frequency control register 67
set FHWUPT         [expr {$CLKCNT_BASE + 0x18}]  ;# Clock startup control register
set FCON89         [expr {$CLKCNT_BASE + 0x20}]  ;# Frequency control register 89
set FSTAT2         [expr {$CLKCNT_BASE + 0x24}]  ;# Frequency status register 2

# Flash Controller Registers (FLASHCNT)
set FLASHA         [expr {$FLASHCNT_BASE + 0x00}]  ;# Flash address register
set FLASHD         [expr {$FLASHCNT_BASE + 0x04}]  ;# Flash data register
set FLASHCON       [expr {$FLASHCNT_BASE + 0x08}]  ;# Flash control register
set FLASHACP       [expr {$FLASHCNT_BASE + 0x0C}]  ;# Flash acceptor
set FLASHSLF       [expr {$FLASHCNT_BASE + 0x14}]  ;# Flash self register
set FLASHSTA       [expr {$FLASHCNT_BASE + 0x18}]  ;# Flash status register

set UAF0IER        [expr {$UARTF0 + 0x04}] ;
set UAF0IIR        [expr {$UARTF0 + 0x08}] ;
set UAF0MOD        [expr {$UARTF0 + 0x0C}] ;
set UAF0LSR        [expr {$UARTF0 + 0x10}] ;
set UAF0CAJ        [expr {$UARTF0 + 0x14}] ;

# GPIO Registers
set EXIST          [expr {$NINT + 0x04}] ;# External Interrupt status register
set EXI03SEL       [expr {$NINT + 0x0C}] ;# External interrupt 03 selection register
set P3MOD0         [expr {$PORT3 + 0x08}] ;
set P3MOD1         [expr {$PORT3 + 0x0C}] ;

# WDT Registers
set WDTCON         [expr {$WDT_BASE + 0x00}]  ;# Watchdog timer control register
set WDTMOD         [expr {$WDT_BASE + 0x04}]  ;# Watchdog timer mode register

# Constants from driver
set FLASH_ACCEPTER_FLAG1_INIT 0x003CC300
set FLASH_ACCEPTER_FLAG2_INIT 0x00699600
set FLASH_ACCEPTER_FLAG1_SET  0x3CC33CFA
set FLASH_ACCEPTER_FLAG2_SET  0x699669F5
set FLASH_ENABLE_SELF_PROGRAMMING 0xA5A5A5A5
set FLASH_DISABLE_SELF_PROGRAMMING 0x5A5A5A5A
set FLC_ERA_SECTOR_ERASE      0x02
set FLC_ERA_BLOCK_ERASE      0x01

set FLASH_PRGM_SECTOR_ADDR_MASK 0xFFFFF800
set FLASH_PRGM_BLOCK_ADDR_MASK  0xFFFF8000


set FLASH_OK        0
set FLASH_NG        1

# WDT Constants
set WDT_2S                     0x02  ;# WDT 2 second timeout
set WDT_8S                     0x03  ;# WDT 8 second timeout

# Clock configuration constants
set CLK_SYSC_OSCLK           0x00
set CLK_OUTC_OSCLK_DIV8      0x60
set CLK_XSPEN_DIS            0x00
set CLK_HXSPEN_DIS           0x00
set S_FLASH_FACP1            FLASH_ACCEPTER_FLAG1_INIT
set S_FLASH_FACP2            FLASH_ACCEPTER_FLAG2_INIT
set S_FLASH_EN               0x00000000
set S_FLASH_DIS              0x00000000

# Memory access procedures
proc write_mem32 {addr value} {
    ml63.dap apsel 0
    ml63.dap apreg 0 0x00 0x22000012
    ml63.dap apreg 0 0x04 $addr
    ml63.dap apreg 0 0x0C $value
}

proc read_mem32 {addr} {
    ml63.dap apsel 0
    ml63.dap apreg 0 0x00 0x22000012
    ml63.dap apreg 0 0x04 $addr
    return [ml63.dap apreg 0 0x0C]
}

proc read_mem8 {addr} {
    [read_mem32 $addr]
}

proc write_mem8 {addr value} {
    write_mem32 $addr [expr {$value & 0xFF}]
}

# WDT procedures
proc wdt_init {} {
    global WDTMOD WDT_2S
    echo "Initializing WDT with 2s timeout..."
    write_mem32 $WDTMOD $WDT_2S
}

proc wdt_clear {} {
    global WDTCON
    # Clear sequence: write 0x5A, wait for WDP bit, then write 0xA5
    write_mem32 $WDTCON 0x5A
    # Wait 1ms for WDP to be set
    sleep 1
    write_mem32 $WDTCON 0xA5
}

proc flash_init {} {
     global S_FLASH_FACP1 S_FLASH_FACP2 S_FLASH_EN S_FLASH_DIS
     global FLASH_ACCEPTER_FLAG1_INIT FLASH_ACCEPTER_FLAG2_INIT

     set S_FLASH_FACP1 $FLASH_ACCEPTER_FLAG1_INIT
     set S_FLASH_FACP2 $FLASH_ACCEPTER_FLAG2_INIT
     set S_FLASH_EN 0x00000000
     set S_FLASH_DIS 0x00000000
}

proc flash_open {} {
     global S_FLASH_FACP1 S_FLASH_FACP2 S_FLASH_EN S_FLASH_DIS FLASH_OK FLASH_NG
     global FLASH_ACCEPTER_FLAG1_INIT FLASH_ACCEPTER_FLAG2_INIT
     global FLASH_ACCEPTER_FLAG1_SET FLASH_ACCEPTER_FLAG2_SET
     global FLASH_ENABLE_SELF_PROGRAMMING FLASH_DISABLE_SELF_PROGRAMMING

     if { $S_FLASH_FACP1 == $FLASH_ACCEPTER_FLAG1_INIT && $S_FLASH_FACP2 == $FLASH_ACCEPTER_FLAG2_INIT && \
          $S_FLASH_EN == 0x00000000 && $S_FLASH_DIS == 0x00000000 } {
          set S_FLASH_FACP1 $FLASH_ACCEPTER_FLAG1_SET
          set S_FLASH_FACP2 $FLASH_ACCEPTER_FLAG2_SET
          set S_FLASH_EN $FLASH_ENABLE_SELF_PROGRAMMING
          set S_FLASH_DIS $FLASH_DISABLE_SELF_PROGRAMMING
          return $FLASH_OK
     }

     return $FLASH_NG
}

proc flash_close { } {
     global S_FLASH_FACP1 S_FLASH_FACP2 S_FLASH_EN S_FLASH_DIS FLASH_OK FLASH_NG FLASHSLF
     global FLASH_ACCEPTER_FLAG1_SET FLASH_ACCEPTER_FLAG2_SET
     global FLASH_ACCEPTER_FLAG1_INIT FLASH_ACCEPTER_FLAG2_INIT
     global FLASH_ENABLE_SELF_PROGRAMMING FLASH_DISABLE_SELF_PROGRAMMING

     if { $S_FLASH_FACP1 == $FLASH_ACCEPTER_FLAG1_SET && $S_FLASH_FACP2 == $FLASH_ACCEPTER_FLAG2_SET && \
          $S_FLASH_EN == $FLASH_ENABLE_SELF_PROGRAMMING && $S_FLASH_DIS == $FLASH_DISABLE_SELF_PROGRAMMING } {
          set S_FLASH_FACP1 $FLASH_ACCEPTER_FLAG1_INIT
          set S_FLASH_FACP2 $FLASH_ACCEPTER_FLAG2_INIT
          set S_FLASH_EN 0x00000000
          set S_FLASH_DIS 0x00000000
          return $FLASH_OK
     }

     return $FLASH_NG
}

proc flash_self_program { selfFlag } {
     global S_FLASH_FACP1 S_FLASH_FACP2 S_FLASH_EN S_FLASH_DIS FLASH_OK FLASH_NG FLASHSLF
     global FLASH_ENABLE_SELF_PROGRAMMING FLASH_DISABLE_SELF_PROGRAMMING

     if { $selfFlag == $FLASH_ENABLE_SELF_PROGRAMMING || $selfFlag == $FLASH_DISABLE_SELF_PROGRAMMING } {
        set selfFlag_val [expr {$selfFlag & 0x01}]
        write_mem8 $FLASHSLF $selfFlag_val
        return $FLASH_OK
     }

     return $FLASH_NG
}

# Set system clock to 48MHz PLL
proc set_clock_48mhz {} {
    global FCON01 FCON23 FSTAT FCON67 FSTAT2
    global CLK_SYSC_OSCLK CLK_OUTC_OSCLK_DIV8

    echo "Setting system clock to 48MHz PLL..."

    # Step 1: Set HSCLK mode (clk_setHsclk equivalent)
    # CLK_SYSC_OSCLK | CLK_OUTC_OSCLK_DIV8 = 0x00 | 0x60 = 0x60
    set fcon0_val [expr {$CLK_SYSC_OSCLK | $CLK_OUTC_OSCLK_DIV8}]

    # Read current FCON01 value
    set fcon01_val [read_mem32 $FCON01]

    # Clear bits 0-7 (FCON0) and set new value
    set fcon01_val [expr {($fcon01_val & 0xFFFFFF00) | $fcon0_val}]

    # Clear XSPEN (bit 12) and HXSPEN (bit 13) - disable crystal stop detection
    set fcon01_val [expr {$fcon01_val & ~0x3000}]

    # Write back FCON01
    write_mem32 $FCON01 $fcon01_val

    echo "  FCON01 set to 0x[format %08X $fcon01_val]"

    # Step 2: Enable PLL (clk_enaPLLHsclk)
    # Set bit 10 of FCON01
    set fcon01_val [expr {$fcon01_val | (1 << 10)}]
    write_mem32 $FCON01 $fcon01_val

    echo "  PLL enabled"

    # Step 3: Wait for PLL stable (clk_checkPllStable)
    echo "  Waiting for PLL to stabilize..."
    set timeout 1000
    while {$timeout > 0} {
        set fstat2_val [read_mem32 $FSTAT2]
        # Check bit 14 for PLL stable
        if {[expr {$fstat2_val & (1 << 14)}] != 0} {
            echo "  PLL is stable!"
            break
        }
        sleep 1
        incr timeout -1
    }

    if {$timeout == 0} {
        echo "  WARNING: PLL stabilization timeout!"
    }

    # Step 4: Set SYSCLK to HSCLK (clk_setSysclk)
    # Set bit 16 of FCON01 for SYSCLK = HSCLK
    set fcon01_val [read_mem32 $FCON01]
    set fcon01_val [expr {$fcon01_val | (1 << 8)}]
    write_mem32 $FCON01 $fcon01_val

    echo "  System clock switched to HSCLK (48MHz)"

    # Verify clock status
    set fstat_val [read_mem32 $FSTAT]
    echo "  FSTAT: 0x[format %08X $fstat_val]"
}

# Flash programming with 48MHz clock
proc flash_program {test_addr test_data} {
    global FCON01 FCON23 FSTAT FCON67 FSTAT2
    global FLASHA FLASHD FLASHCON FLASHACP FLASHSLF FLASHSTA
    global FLASH_ACCEPTER_FLAG1_SET FLASH_ACCEPTER_FLAG2_SET
    global FLC_ERA_BLOCK_ERASE FLASH_PRGM_BLOCK_ADDR_MASK
    global FLASH_ENABLE_SELF_PROGRAMMING FLASH_DISABLE_SELF_PROGRAMMING

    echo ""
    echo "=== ML63Q2537 Flash Programming with 48MHz Clock ==="

    # Initialize WDT with 2s timeout
    wdt_init

    # Set clock to 48MHz first
    set_clock_48mhz

    # Clear WDT after clock setup
    wdt_clear

    echo ""
    echo "Starting flash operations..."

    # Step 1: Initialize flash controller
    echo "Step 1: Reset flash controller..."
    # write_mem8 $FLASHSLF 0x00
    # write_mem8 $FLASHACP 0x00

    flash_init

    flash_open

    # Step 2: Enable self programming
    echo "Step 2: Enable self programming..."
    # write_mem8 $FLASHSLF 0x01
    flash_self_program $FLASH_ENABLE_SELF_PROGRAMMING

    # Step 3: Read original
    set orig [read_mem32 $test_addr]
    echo "Step 3: Original at 0x[format %08X $test_addr]: 0x[format %08X $orig]"

    # Step 4: Check flash status
    set status [read_mem32 $FLASHSTA]
    echo "Step 4: Flash status before erase: 0x[format %08X $status]"

    # Step 5: Erase sector
    echo "Step 5: Erasing sector..."

    # Clear WDT before erase operation
    wdt_clear

    # Set flash acceptor - 0xFA then 0xF5
    write_mem32 $FLASHACP [expr {$FLASH_ACCEPTER_FLAG1_SET & 0xFF}]
    write_mem32 $FLASHACP [expr {$FLASH_ACCEPTER_FLAG2_SET & 0xFF}]

    # Set flash address
    write_mem32 $FLASHA [expr {$FLASH_PRGM_BLOCK_ADDR_MASK & $test_addr}]

    # Start sector erase
    write_mem32 $FLASHCON $FLC_ERA_BLOCK_ERASE

    sleep 100
    # Wait for completion
    # set status [flash_check_access]
    set status [read_mem32 $FLASHSTA]

    while { $status != 0 } {
          wdt_clear
          echo " Erasing status = 0x[format %08x $status]"
          sleep 10
          # set status [flash_check_access]
          set status [read_mem32 $FLASHSTA]
    }

    # Clear WDT after erase
    wdt_clear

    set status [read_mem32 $FLASHSTA]
    echo "  Erase status: 0x[format %08X $status]"

    # Step 6: Read after erase
    set erased [read_mem32 $test_addr]
    echo "Step 6: After erase: 0x[format %08X $erased]"

    flash_close

    flash_open

    # write_mem8 $FLASHSLF 0x01
    flash_self_program $FLASH_ENABLE_SELF_PROGRAMMING

    # Step 7: Write data
    echo "Step 7: Writing 0x[format %08X $test_data]..."

    # Clear WDT before write operation
    wdt_clear

    # Set flash acceptor again
    write_mem32 $FLASHACP [expr {$FLASH_ACCEPTER_FLAG1_SET & 0xFF}]
    write_mem32 $FLASHACP [expr {$FLASH_ACCEPTER_FLAG2_SET & 0xFF}]

    # Set flash address
    write_mem32 $FLASHA $test_addr

    # Write data
    write_mem32 $FLASHD $test_data

    # Wait for write
    sleep 50

    # Clear WDT after write
    wdt_clear

    set status [read_mem32 $FLASHSTA]
    echo "  Write status: 0x[format %08X $status]"

    # Step 8: Read result
    set result [read_mem32 $test_addr]
    echo "Step 8: After write: 0x[format %08X $result]"

    # Step 9: Disable self programming
    echo "Step 9: Disable self programming..."
    write_mem8 $FLASHSLF 0x00
    write_mem8 $FLASHACP 0x00

    # Final WDT clear
    wdt_clear

    # Check result
    echo ""
    if {$result == $test_data} {
        echo "*** SUCCESS! Flash write verified at 48MHz! ***"
        echo "*** Data 0x[format %08X $test_data] written to 0x[format %08X $test_addr] ***"
    } else {
        echo "Flash write failed - expected 0x[format %08X $test_data], got 0x[format %08X $result]"

        # Debug info
        echo ""
        echo "Debug - Flash controller state:"
        echo "  FLASHA:   0x[format %08X [read_mem32 $FLASHA]]"
        echo "  FLASHD:   0x[format %08X [read_mem32 $FLASHD]]"
        echo "  FLASHCON: 0x[format %08X [read_mem32 $FLASHCON]]"
        echo "  FLASHACP: 0x[format %08X [read_mem32 $FLASHACP]]"
        echo "  FLASHSLF: 0x[format %08X [read_mem32 $FLASHSLF]]"
        echo "  FLASHSTA: 0x[format %08X [read_mem32 $FLASHSTA]]"

        echo ""
        echo "Clock registers:"
        echo "  FCON01: 0x[format %08X [read_mem32 $FCON01]]"
        echo "  FSTAT:  0x[format %08X [read_mem32 $FSTAT]]"
        echo "  FSTAT2: 0x[format %08X [read_mem32 $FSTAT2]]"
    }
}

# Erase flash block for firmware programming
proc flash_erase_block {addr size} {
    global FLASHA FLASHCON FLASHACP FLASHSTA
    global FLASH_ACCEPTER_FLAG1_SET FLASH_ACCEPTER_FLAG2_SET
    global FLC_ERA_BLOCK_ERASE FLASH_PRGM_BLOCK_ADDR_MASK

    wdt_clear

    echo "Erasing block at 0x[format %08X $addr], size: $size bytes"

    # Calculate number of 32KB blocks needed
    set blocks_needed [expr {($size + 0x7FFF) / 0x8000}]

    for {set i 0} {$i < $blocks_needed} {incr i} {
        set block_addr [expr {$addr + ($i * 0x8000)}]
        echo "  Erasing block $i at 0x[format %08X $block_addr]..."

        # Clear WDT
        wdt_clear

        # Set flash acceptor
        write_mem32 $FLASHACP [expr {$FLASH_ACCEPTER_FLAG1_SET & 0xFF}]
        write_mem32 $FLASHACP [expr {$FLASH_ACCEPTER_FLAG2_SET & 0xFF}]

        # Set flash address (aligned to block boundary)
        write_mem32 $FLASHA [expr {$FLASH_PRGM_BLOCK_ADDR_MASK & $block_addr}]

        # Start block erase
        write_mem32 $FLASHCON $FLC_ERA_BLOCK_ERASE

        # Wait for completion
        sleep 50
        set status [read_mem32 $FLASHSTA]

        while {$status != 0} {
            wdt_clear
            sleep 10
            set status [read_mem32 $FLASHSTA]
        }
    }

    echo "Block erase complete"
}

# Program single word to flash (with proper sequence)
proc flash_write_word {addr data} {
    global FLASHA FLASHD FLASHCON FLASHACP FLASHSTA
    global FLASH_ACCEPTER_FLAG1_SET FLASH_ACCEPTER_FLAG2_SET

    # Set flash acceptor
    write_mem32 $FLASHACP [expr {$FLASH_ACCEPTER_FLAG1_SET & 0xFF}]
    write_mem32 $FLASHACP [expr {$FLASH_ACCEPTER_FLAG2_SET & 0xFF}]

    # Set flash address
    write_mem32 $FLASHA $addr

    # Write data
    write_mem32 $FLASHD $data

    # Wait for write completion
    sleep 1
    set status [read_mem32 $FLASHSTA]

    while {$status != 0} {
        wdt_clear
        sleep 1
        set status [read_mem32 $FLASHSTA]
    }
}

# Program buffer to flash
proc flash_write_buffer {addr data_list} {
    global FLASH_ENABLE_SELF_PROGRAMMING

    set word_count [llength $data_list]
    echo "Programming $word_count words starting at 0x[format %08X $addr]..."

    # Enable self programming
    flash_self_program $FLASH_ENABLE_SELF_PROGRAMMING

    set current_addr $addr
    set words_written 0

    foreach data_word $data_list {
        # Write word
        flash_write_word $current_addr $data_word

        incr words_written
        incr current_addr 4

        # Progress indicator and WDT clear every 256 words (1KB)
        if {[expr {$words_written % 256}] == 0} {
            wdt_clear
            echo "  Progress: $words_written / $word_count words"
        }
    }

    echo "Buffer programming complete: $words_written words"
}

# Program test pattern to verify flash works
proc program_test_pattern {base_addr num_words} {
    global FLASH_ENABLE_SELF_PROGRAMMING

    echo "Programming test pattern to flash..."

    # Enable self programming
    flash_self_program $FLASH_ENABLE_SELF_PROGRAMMING

    set current_addr $base_addr

    for {set i 0} {$i < $num_words} {incr i} {
        # Create test pattern
        set data [expr {0xDEAD0000 + $i}]

        # Write to flash
        flash_write_word $current_addr $data

        incr current_addr 4

        # Progress and WDT clear every 256 words
        if {[expr {$i % 256}] == 0} {
            wdt_clear
            set percent [expr {($i * 100) / $num_words}]
            echo "  Progress: $percent% ($i/$num_words words)"
        }
    }

    echo "Test pattern programming complete!"
}

# Direct flash programming without file loading
proc direct_flash_program {base_addr data_list} {
    global FLASH_ENABLE_SELF_PROGRAMMING

    echo "Direct flash programming..."

    # Enable self programming
    flash_self_program $FLASH_ENABLE_SELF_PROGRAMMING

    set current_addr $base_addr
    set word_count [llength $data_list]
    set words_written 0

    foreach data $data_list {
        # Write to flash
        flash_write_word $current_addr $data

        incr current_addr 4
        incr words_written

        # Progress and WDT clear every 256 words
        if {[expr {$words_written % 256}] == 0} {
            wdt_clear
            set percent [expr {($words_written * 100) / $word_count}]
            echo "  Progress: $percent% ($words_written/$word_count words)"
        }
    }

    echo "Direct programming complete: $words_written words"
}

# Verify flash is erased and ready
proc verify_flash_ready {base_addr size} {
    echo ""
    echo "Verifying flash is erased..."

    # Check first few words
    for {set i 0} {$i < 4} {incr i} {
        set addr [expr {$base_addr + ($i * 4)}]
        set data [read_mem32 $addr]
        if {$data == 0xFFFFFFFF} {
            echo "  0x[format %08X $addr]: 0x[format %08X $data] ✓ (erased)"
        } else {
            echo "  0x[format %08X $addr]: 0x[format %08X $data] ✗ (not erased!)"
        }
    }

    echo ""
    echo "Flash is ready for programming."
    echo "Next step: source flash_from_hex.tcl"
}

# Simple approach that works without load_image
proc load_and_program {filename base_addr size} {
    global FLASH_ENABLE_SELF_PROGRAMMING

    echo "Preparing for firmware programming..."
    echo "File: $filename"
    echo "Target address: 0x[format %08X $base_addr]"
    echo "Size: $size bytes"

    # Since load_image has issues, provide alternative methods
    echo ""
    echo "Flash has been erased and is ready for programming."
    echo ""
    echo "Option 1: Test flash with pattern"
    echo "  program_test_pattern $base_addr 1024"
    echo ""
    echo "Option 2: Program specific data"
    echo "  direct_flash_program $base_addr {0x12345678 0xABCDEF00 ...}"
    echo ""
    echo "Option 3: Use external tool to convert $filename to flash commands"
    echo ""

    # Flash is erased and ready - just verify it's erased
    echo "Verifying flash is erased..."
    for {set i 0} {$i < 4} {incr i} {
        set addr [expr {$base_addr + ($i * 4)}]
        set data [read_mem32 $addr]
        if {$data == 0xFFFFFFFF} {
            echo "  0x[format %08X $addr]: 0x[format %08X $data] ✓ (erased)"
        } else {
            echo "  0x[format %08X $addr]: 0x[format %08X $data] ✗ (not erased!)"
        }
    }
    echo ""
    echo "Flash is erased and ready for programming."
    echo "DO NOT write test patterns to the firmware area!"
}

# Load binary file to memory using OpenOCD commands
proc load_bin_file {filename addr} {
    echo "Loading binary file $filename to 0x[format %08X $addr]..."

    # Try to load the image (we're already connected via DAP)
    if {[catch {load_image $filename $addr bin} load_result]} {
        echo "Failed to load with load_image: $load_result"
        return -1
    }

    echo "File loaded successfully"
    return 0
}

# Program data from RAM to flash
proc program_from_ram {ram_addr flash_addr size} {
    global FLASH_ENABLE_SELF_PROGRAMMING

    echo "Programming from RAM 0x[format %08X $ram_addr] to flash 0x[format %08X $flash_addr]"
    echo "Size: $size bytes"

    # Enable self programming
    flash_self_program $FLASH_ENABLE_SELF_PROGRAMMING

    set words [expr {$size / 4}]
    set current_flash $flash_addr
    set current_ram $ram_addr

    for {set i 0} {$i < $words} {incr i} {
        # Read word from RAM
        set data [read_mem32 $current_ram]

        # Write to flash
        flash_write_word $current_flash $data

        incr current_flash 4
        incr current_ram 4

        # Progress and WDT clear every 256 words
        if {[expr {$i % 256}] == 0} {
            wdt_clear
            set percent [expr {($i * 100) / $words}]
            echo "  Progress: $percent% ($i/$words words)"
        }
    }

    echo "Programming complete: $words words written"
}

# Prepare flash for programming (erase and setup)
proc prepare_flash {{base_addr 0x10000000} {size 0x40000}} {
    global FLASHA FLASHD FLASHCON FLASHACP FLASHSLF FLASHSTA
    global FLASH_ACCEPTER_FLAG1_SET FLASH_ACCEPTER_FLAG2_SET
    global FLASH_ENABLE_SELF_PROGRAMMING

    echo ""
    echo "====================================="
    echo "Preparing flash for programming"
    echo "Base address: 0x[format %08X $base_addr]"
    echo "Size: 0x[format %08X $size]"
    echo "====================================="

    # Initialize WDT with 2s timeout
    wdt_init

    # Set clock to 48MHz
    set_clock_48mhz

    # Clear WDT after clock setup
    wdt_clear

    # Initialize flash controller
    flash_init
    flash_open

    # Enable self programming
    flash_self_program $FLASH_ENABLE_SELF_PROGRAMMING

    wdt_clear
    # Erase flash first
    echo "Step 1: Erasing flash..."
    flash_erase_block $base_addr $size

    # Re-enable self programming after erase
    flash_close
    flash_open
    flash_self_program $FLASH_ENABLE_SELF_PROGRAMMING

    # Prepare flash for firmware
    echo "Step 2: Preparing flash for firmware..."

    # Just verify flash is erased and ready
    verify_flash_ready $base_addr $size

    # Disable self programming
    write_mem8 $FLASHSLF 0x00
    write_mem8 $FLASHACP 0x00

    # Final WDT clear
    wdt_clear

    # Verify
    echo ""
    echo "Verification:"
    set first_word [read_mem32 $base_addr]
    echo "  First word at 0x[format %08X $base_addr]: 0x[format %08X $first_word]"

    echo ""
    echo "*** Flash prepared and ready for programming ***"
}

# Program firmware with automatic erase
proc program_firmware_with_erase {filename {base_addr 0x10000000} {size 0x40000}} {
    global FLASHA FLASHD FLASHCON FLASHACP FLASHSLF FLASHSTA
    global FLASH_ACCEPTER_FLAG1_SET FLASH_ACCEPTER_FLAG2_SET
    global FLASH_ENABLE_SELF_PROGRAMMING

    echo ""
    echo "====================================="
    echo "Programming firmware with erase"
    echo "File: $filename"
    echo "Base address: 0x[format %08X $base_addr]"
    echo "Size: 0x[format %08X $size] bytes"
    echo "====================================="

    # Initialize WDT with 2s timeout
    wdt_init

    # Set clock to 48MHz
    set_clock_48mhz

    # Clear WDT after clock setup
    wdt_clear

    # Initialize flash controller
    flash_init
    flash_open

    # Enable self programming
    flash_self_program $FLASH_ENABLE_SELF_PROGRAMMING

    # Erase flash blocks
    flash_erase_block $base_addr $size

    # Clear WDT after erase
    wdt_clear

    # Close and reopen flash for programming
    flash_close
    flash_open
    flash_self_program $FLASH_ENABLE_SELF_PROGRAMMING

    # Program the firmware
    echo ""
    echo "Programming firmware..."

    # Program the firmware data
    echo ""
    echo "Flash has been erased and is ready."
    echo "To complete programming, load your firmware data and use:"
    echo "  flash_write_buffer <addr> {word1 word2 word3 ...}"

    # Disable self programming
    write_mem8 $FLASHSLF 0x00
    write_mem8 $FLASHACP 0x00

    # Final WDT clear
    wdt_clear

    echo ""
    echo "*** Firmware programming completed successfully! ***"
}

# Test command
proc test_flash {} {
    # Test at safe location in flash
    flash_program 0x10008000 0x12345678
}

# Just set clock without flash operations
proc test_clock {} {
    set_clock_48mhz

    global FCON01 FSTAT FSTAT2
    echo ""
    echo "Clock registers after setup:"
    echo "  FCON01: 0x[format %08X [read_mem32 $FCON01]]"
    echo "  FSTAT:  0x[format %08X [read_mem32 $FSTAT]]"
    echo "  FSTAT2: 0x[format %08X [read_mem32 $FSTAT2]]"
}

proc test_registers {} {
    global CLKCON RSTCON P3MOD0 UAF0IER UAF0IIR UAF0MOD UAF0LSR
    echo "register values:"
    echo "                      32      24      16       8       0"
    echo "  CLKCON:  0x[format %08X [read_mem32 $CLKCON]] 0b[format %032b [read_mem32 $CLKCON]]"
    echo "  RSTCON:  0x[format %08X [read_mem32 $RSTCON]] 0b[format %032b [read_mem32 $RSTCON]]" 
    echo "  P3MOD0:  0x[format %08X [read_mem32 $P3MOD0]]"
    echo "  UAF0IER: 0x[format %08X [read_mem32 $UAF0IER]]"
    echo "  UAF0IIR: 0x[format %08X [read_mem32 $UAF0IIR]]"
    echo "  UAF0MOD: 0x[format %08X [read_mem32 $UAF0MOD]]"
    echo "  UAF0LSR: 0x[format %08X [read_mem32 $UAF0LSR]]"
}


